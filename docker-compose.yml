services:
  db:
    image: postgres:16-alpine
    container_name: enterpriseai-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-enterprise_ai}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be configured in environment}
      POSTGRES_DB: ${POSTGRES_DB:-enterprise_ai}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U enterprise_ai -d enterprise_ai"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - enterpriseai-net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: enterpriseai-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-enterprise_ai}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be configured in environment}@db:5432/${POSTGRES_DB:-enterprise_ai}
      APP_ENVIRONMENT: ${APP_ENVIRONMENT:-production}
      ADMIN_API_KEY: ${ADMIN_API_KEY:?ADMIN_API_KEY must be configured in environment}
      FINANCE_API_KEY: ${FINANCE_API_KEY:?FINANCE_API_KEY must be configured in environment}
      SUPPLY_CHAIN_API_KEY: ${SUPPLY_CHAIN_API_KEY:?SUPPLY_CHAIN_API_KEY must be configured in environment}
      OPERATOR_API_KEY: ${OPERATOR_API_KEY:?OPERATOR_API_KEY must be configured in environment}
      VIEWER_API_KEY: ${VIEWER_API_KEY:?VIEWER_API_KEY must be configured in environment}
      SCHEDULER_ENABLED: "${SCHEDULER_ENABLED:-true}"
      SCHEDULER_INTERVAL_SECONDS: "${SCHEDULER_INTERVAL_SECONDS:-300}"
      SIMULATE_BLOCKCHAIN: "${SIMULATE_BLOCKCHAIN:-true}"
      NEO4J_URI: "${NEO4J_URI:-bolt://neo4j:7687}"
      NEO4J_USER: "${NEO4J_USER:-neo4j}"
      NEO4J_PASSWORD: "${NEO4J_PASSWORD:-enterprise_dev_pass}"
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/live"]
      interval: 15s
      timeout: 5s
      retries: 3
    networks:
      - enterpriseai-net

  neo4j:
    image: neo4j:5.18.0-community
    container_name: enterpriseai-neo4j
    restart: unless-stopped
    environment:
      NEO4J_AUTH: ${NEO4J_AUTH:-neo4j/enterprise_dev_pass}
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:7474 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks:
      - enterpriseai-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: http://localhost:8000
    container_name: enterpriseai-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "5173:80"
    networks:
      - enterpriseai-net

volumes:
  postgres_data:
    driver: local
  neo4j_data:
    driver: local

networks:
  enterpriseai-net:
    driver: bridge
