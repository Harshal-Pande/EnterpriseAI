services:
  db:
    image: postgres:16-alpine
    container_name: enterpriseai-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: enterprise_ai
      POSTGRES_PASSWORD: enterprise_ai_password
      POSTGRES_DB: enterprise_ai
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U enterprise_ai -d enterprise_ai"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - enterpriseai-net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: enterpriseai-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://enterprise_ai:enterprise_ai_password@db:5432/enterprise_ai
      APP_ENVIRONMENT: production
      ADMIN_API_KEY: ${ADMIN_API_KEY:-prod-admin-secure-key}
      FINANCE_API_KEY: ${FINANCE_API_KEY:-prod-finance-secure-key}
      SUPPLY_CHAIN_API_KEY: ${SUPPLY_CHAIN_API_KEY:-prod-supply-secure-key}
      OPERATOR_API_KEY: ${OPERATOR_API_KEY:-prod-operator-secure-key}
      VIEWER_API_KEY: ${VIEWER_API_KEY:-prod-viewer-secure-key}
      SCHEDULER_ENABLED: "true"
      SCHEDULER_INTERVAL_SECONDS: "300"
      SIMULATE_BLOCKCHAIN: "true"
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/live"]
      interval: 15s
      timeout: 5s
      retries: 3
    networks:
      - enterpriseai-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: http://localhost:8000
    container_name: enterpriseai-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "5173:80"
    networks:
      - enterpriseai-net

volumes:
  postgres_data:
    driver: local

networks:
  enterpriseai-net:
    driver: bridge
